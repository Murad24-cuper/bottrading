# Account mode selects safeguards; real also requires ALLOW_REAL=true in .env.
account:
  mode: demo                    # demo | real

# Position sizing and hard trading limits. Session rules are inferred from broker data in UTC.
risk:
  risk_per_trade_pct: 0.25       # Equity risk at the stop per entry
  daily_loss_limit_pct: 3.0      # Stop new trades after this daily equity loss
  weekly_loss_limit_pct: 8.0     # Stop new trades after this weekly equity loss
  max_trades_per_day: 150        # Global cap on new trades per UTC day
  max_open_positions: 20         # Total concurrent positions
  max_positions_per_group: 6     # Correlation guard per asset group
  max_positions_per_currency: 3  # Net directional positions per FX/metals currency
  max_positions_per_underlying_group: 3 # Concurrent positions per underlying group
  symbol_cooldown_minutes: 20    # Fixed cooldown; never shortened by scanner vacancies
  max_trades_per_symbol_per_day: 4 # Maximum daily opens per underlying (UTC day)
  max_group_share_today: 0.4     # Group cap after at least 10 daily trades
  max_margin_usage_pct: 50       # Maximum projected margin / equity
  max_hold_minutes: 20           # Default hard holding limit; protected winners may extend
  max_hold_extended_minutes: 60  # Hard ceiling including protected-profit extensions
  extend_step_minutes: 10        # Recheck continuation after each extension step
  first_target_r: 0.8            # Take partial profit after this favorable R multiple
  scale_out_pct: 50                # Percent to close at first target
  trail_atr_mult: 1.0             # ATR(M1) distance for trailing stop
  stagnation_minutes: 6          # Close if price has not progressed enough by this age
  move_horizon_minutes: 10       # Horizon used to estimate ATR-based target movement
  stagnation_min_r: 0.2           # Minimum favorable R progress by stagnation_minutes
  momentum_lookback_bars: 5       # Closed bars used to detect momentum reversal
  breakeven_cost_multiplier: 1.0  # Include this multiple of estimated round-trip costs
  min_risk_reward: 1.2           # Minimum net TP / SL reward ratio after costs
  max_cost_to_target_ratio: 0.3  # Maximum estimated round-trip cost / TP value
  max_spread_points: {}          # Optional per-symbol spread caps
  no_entry_before_close_minutes: 60 # Skip a symbol shortly before its next broker session close
  max_session_gap_hours: 6       # Close owned positions before longer broker session breaks
  sl_move_mult: 0.8               # ATR(M1)*sqrt(move_horizon_minutes) stop multiplier
  tp_move_mult: 1.2               # ATR(M1)*sqrt(move_horizon_minutes) target multiplier
  gating_window: 20               # Closed trades used for expectancy gating
  gating_disable_hours: 24        # Disable negative strategies/groups
  early_exit_enabled: true
  early_exit_score_threshold: 3
  early_exit_min_r: -0.7
  early_exit_max_r: -0.2
  early_exit_ema_fast: 5
  early_exit_ema_slow: 13
  early_exit_swing_lookback: 5
  early_exit_rsi_period: 14
  early_exit_roc_period: 5
  early_exit_volume_lookback: 20
  early_exit_volume_spike_ratio: 1.5
  early_exit_weights: {ema_cross: 1, swing_break: 1, momentum: 1, volume_spike: 1}

# Broker names vary by XM server and account type. These are search patterns.
universe:
  include_groups: [forex, metals, indices, energy, crypto, stocks]
  refresh_minutes: 5           # Refresh broker symbol discovery/cache interval
  tick_freshness_seconds_by_group: {forex: 120, metals: 180, indices: 180, energy: 300, crypto: 300, stocks: 1800, other: 180}
  exclude_symbols: []
  exclude_dated_futures: true    # Exclude names ending in month/year contract codes
  symbol_aliases:
    GOLD: [GOLD, XAUUSD]
    SILVER: [SILVER, XAGUSD]
    EURUSD: [EURUSD]
    GBPUSD: [GBPUSD]
    USDJPY: [USDJPY]
    AUDUSD: [AUDUSD]
    USDCAD: [USDCAD]
    EURJPY: [EURJPY]
    GBPJPY: [GBPJPY]
    US30: [US30]
    NAS100: [US100, NAS100, USTEC]
    GER40: [GER40, DAX]
    OIL: [OIL, WTI, USOIL]
    BTCUSD: [BTCUSD, BTC]
    ETHUSD: [ETHUSD, ETH]

timeframes: [M1, M5, M15]
magic_number: 20260001
executor:
  deviation_points: 20           # Maximum permitted execution deviation
strategies:
  trend_pullback:
    enabled: true
    groups: [forex, metals, indices]
    timeframes: [M1, M5, M15]
    params: {trend_ema_fast: 20, trend_ema_slow: 50, adx_min: 18, pullback_atr: 0.45, stop_atr: 1.5, reward_risk: 1.8}
  mean_reversion:
    enabled: true
    groups: [forex, metals, indices, energy, crypto, stocks]
    timeframes: [M1, M5, M15]
    params: {bb_period: 20, bb_std: 2.0, rsi_period: 14, rsi_low: 35, rsi_high: 65, near_level_atr: 1.0, allow_quiet_regime: true, stop_atr: 1.2}
  breakout:
    enabled: false               # Disabled: recent demo expectancy was negative
    groups: [forex, metals, indices, energy, crypto, stocks]
    timeframes: [M1, M5, M15]
    params: {range_bars: 20, atr_expansion: 1.0, volume_ratio: 1.0, reward_range: 1.5}
  volatility_scalp:
    enabled: true
    groups: [forex, metals, indices, energy, crypto]
    timeframes: [M1, M5, M15]
    params: {atr_period: 14, volatility_ratio: 1.1, target_atr: 0.4, stop_atr: 0.65, max_spread_target_ratio: 0.35, lookback_bars: 100}
loop:
  interval_seconds: 15            # Period target; work time is subtracted from this interval
scanner:
  max_seconds_per_cycle: 12
  max_candidates: 10
  candle_count: 250
  min_score: 0.0
  min_confidence: 0.55
  target_open_positions: 15     # Scanner work adapts below this target; no forced trades
  require_mtf_agreement: true
  mtf_min_agree: 2               # Require this many agreeing closed-bar timeframes
  mtf_ema_fast: 5               # Fast EMA for M1/M5/M15 direction agreement
  mtf_ema_slow: 13              # Slow EMA for M1/M5/M15 direction agreement
  max_spread_vs_median: 1.8
  spread_median_lookback_hours: 24
  spread_median_cache_seconds: 300
  extend_min_score: 0.7          # Continuation score required to extend a protected winner
  extend_min_score: 0.7
  top_movers: 40                 # Full strategy analysis runs only on top movers
  movement_timeframe_minutes: 30 # Short-term movement measurement for ranking
  max_spread_volatility_ratio: 1.0  # Skip when spread exceeds one ATR; target cost gate remains stricter
  spread_volatility_horizon_minutes: 20 # Compare spread against 20-minute expected movement
  min_movers_per_group: 5        # Round-robin minimum when candidates are available
  repeat_penalty: 0.15           # Expected-R penalty per underlying trade today
  group_repeat_penalty: 0.05     # Expected-R penalty per asset-group trade today
  timeframe_point_sizes: {}     # Optional symbol point sizes for candle spread pricing
live:
  mode: trade                   # shadow = record decisions only; trade = submit orders
  strategies: [trend_pullback, mean_reversion, breakout, volatility_scalp]
  max_cycle_errors: 5           # Disable new entries after this many consecutive errors
  equity_snapshot_seconds: 30
  heartbeat_seconds: 10
  command_ttl_seconds: 60        # Dashboard commands expire after this many seconds
health:
  stale_ticks_seconds: 120       # Reconnect if all open-market symbols have stale ticks
  reconnect_failures_before_pause: 3 # Disable entries after repeated MT5 health failures
  max_memory_mb: 1500
  warn_disk_free_gb: 5
  stop_downloads_free_gb: 2
schedule:
  hourly_minute_utc: 0
  daily_rollover_hour_utc: 0
  daily_backup_keep: 14
  weekly_day_utc: 6
  weekly_hour_utc: 2
notify:
  big_loss_usd: 5.0              # Notify on a single larger net loss
  daily_summary_utc: "21:00"     # Daily summary time in UTC
  rate_limit_minutes: 5          # Per-event notification cooldown
dashboard:
  real_balance_default: 100      # Starting value for the small-account simulation
  real_risk_pct_default: 1.0     # Planned risk percent used in that simulation
paths:
  data_dir: data                 # Relative to project root unless overridden in .env
  logs_dir: logs                 # Relative to project root unless overridden in .env
db:
  signals_retention_days: 7      # Keep recent signals for detailed dashboard views
  events_retention_days: 30      # Keep operational events for 30 days
  equity_retention_days: 30      # Retain full resolution snapshots for 30 days
  equity_downsample_minutes: 5   # Older snapshots are reduced to one per interval
  backup_keep_days: 14           # Number of daily database backups to retain
  vacuum_weekday_utc: 6          # Sunday UTC, while the bot is idle
supervisor:
  hang_seconds: 90               # Restart a live child with a stale heartbeat
  restart_backoff_seconds: [10, 30, 60] # Delay before successive crash restarts
  max_restarts_per_hour: 5       # Stop after this many restarts in one hour
  restart_window_minutes: 60     # Sliding restart limit window
mt5:
  call_timeout_seconds: 20       # Maximum wait for one MT5 package call
confluence:
  enabled: false                 # Observation only until evidence supports activation
  rules: []                       # Optional entry filters; disabled by default
brain:
  enabled: false                  # Live use remains disabled until the acceptance gate passes
  shadow: true                    # Record analysis without changing current trade decisions
  min_checklist: 0.55
  min_probability: 0.55
  min_ev_r: 0.05
  k_neighbors: 300
  kelly_fraction: 0.25
  max_symbols: 400
  max_reference_situations: 1500000
  query_exclude_same_symbol_days: 1
  checklist:
    weights: {trend: 1.0, location: 1.0, pattern: 1.0, candle: 1.0, fibonacci: 0.7, levels: 1.0, momentum: 1.0, volatility: 0.8, session: 0.5, context: 0.5}
  acceptance: {min_trades: 500, min_profit_factor: 1.1, min_symbols: 30, calibration_error: 0.05}
  universe_quotas: {forex: 80, indices: 50, stocks: 100, crypto: 50, metals: 30, energy: 20}
  retrain_day_utc: 6
  retrain_hour_utc: 2
  live_drift_window: 100
  live_max_calibration_error: 0.1
  live_min_expectancy_r: 0.0
history:
  data_dir: data/history
  incremental_refresh_enabled: true
  incremental_timeframes: [M1, M5, M15, H1]
  incremental_batch_days: {M1: 1, M5: 7, M15: 14, H1: 30}
  incremental_refresh_every_cycles: 4
  ranges_months: {M1: 6, M5: 24, M15: 24, H1: 36}
  max_storage_gb: 5
  max_bars_per_request: 80000 # Stay below the MT5 terminal's history response ceiling
  liquid_aliases: [GOLD, SILVER, EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, EURJPY, GBPJPY, US30, NAS100, GER40, OIL, BTCUSD, ETHUSD]
backtest:
  start_equity: 1000
  commission_per_lot_per_side: 0.0
  slippage_points: 1.0
  fallback_spread_points: 15.0
  in_sample_pct: 0.7
  walk_forward_optimize_months: 6
  walk_forward_test_months: 2
  signal_lookback_bars: 120
  parameter_grid:
    trend_pullback: {adx_min: [18, 22], reward_risk: [1.5, 2.0]}
    mean_reversion: {rsi_low: [25, 30], rsi_high: [70, 75]}
    breakout: {range_bars: [15, 20], volume_ratio: [1.1, 1.3]}
    volatility_scalp: {target_atr: [0.3, 0.4], max_spread_target_ratio: [0.15, 0.2]}
db_path: data/bot.db
runtime:
  location: local               # local | server; a mismatch refuses bot startup
